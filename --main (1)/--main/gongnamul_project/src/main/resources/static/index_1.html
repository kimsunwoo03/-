<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공나물 프로젝트 - 단어장</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">🌱 콩나물 단어장</h1>

<div class="card">
    <div class="card-header">단어 목록</div>
    <ul id="word-list" class="list-group list-group-flush">
        <li class="list-group-item">데이터를 불러오는 중...</li>
    </ul>
</div>

<script>
    // 서버에서 데이터를 가져와서 화면에 그려주는 자바스크립트
    fetch('/api/words')
        .then(response => response.json())
        .then(data => {
            const listElement = document.getElementById('word-list');
            listElement.innerHTML = ''; // 초기화

            if(data.length === 0) {
                listElement.innerHTML = '<li class="list-group-item">저장된 단어가 없습니다.</li>';
            } else {
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.innerHTML = `
                        <strong>${item.word}</strong>
                        <span>${item.meaning}</span>
                    `;
                    listElement.appendChild(li);
                });
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('word-list').innerHTML = '<li class="list-group-item text-danger">데이터를 불러오지 못했습니다.</li>';
        });
</script>
</body>
</html>
