<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>단어 목록</span>
        <span class="badge bg-primary" id="word-count">0</span>
    </div>
    <ul id="word-list" class="row g-0 list-unstyled p-0 m-0">
        <li class="col-12 p-3 text-center border-bottom">데이터를 불러오는 중...</li>
    </ul>

    <div class="card-footer d-flex justify-content-center">
        <nav>
            <ul id="pagination" class="pagination mb-0">
            </ul>
        </nav>
    </div>
</div>
<script>
    let currentPage = 0;

    // 1. 단어 목록을 화면에 그리는 전용 함수 (중요!)
    function renderList(words) {
        const listElement = document.getElementById('word-list');
        listElement.innerHTML = '';

        if (!words || words.length === 0) {
            listElement.innerHTML = '<li class="col-12 p-3 text-center border-bottom">저장된 단어가 없습니다.</li>';
            return;
        }

        words.forEach(item => {
            const li = document.createElement('li');
            // 2열 배치를 위해 col-6를 유지합니다.
            li.className = 'col-6 d-flex justify-content-between align-items-center p-3 border-bottom border-end';
            li.innerHTML = `
                <strong class="text-truncate" style="max-width: 60%;">${item.word}</strong>
                <span class="text-muted small text-truncate" style="max-width: 35%;">${item.meaning}</span>
            `;
            listElement.appendChild(li);
        });
    }

    // 2. 서버에서 데이터를 가져오는 함수
    function loadWords(page) {
        currentPage = page;

        fetch(`/api/words?page=${page}&size=20`)
            .then(response => {
                if (!response.ok) throw new Error('네트워크 응답 에러');
                return response.json();
            })
            .then(data => {
                // 백엔드가 Page<Word>를 주면 데이터는 data.content에 있습니다.
                renderList(data.content);
                renderPagination(data.totalPages);
                // 총 개수는 data.totalElements입니다.
                document.getElementById('word-count').innerText = data.totalElements;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('word-list').innerHTML =
                    '<li class="col-12 p-3 text-center text-danger border-bottom">데이터를 불러오지 못했습니다.</li>';
            });
    }

    // 3. 페이지네이션 버튼 생성 함수
    function renderPagination(totalPages) {
    const nav = document.getElementById('pagination');
    nav.innerHTML = '';

    const PAGE_BLOCK_SIZE = 10; // 한 번에 보여줄 번호 개수
    const currentBlock = Math.floor(currentPage / PAGE_BLOCK_SIZE);
    const startPage = currentBlock * PAGE_BLOCK_SIZE;
    const endPage = Math.min(startPage + PAGE_BLOCK_SIZE, totalPages);

    // 1. [이전] 화살표 버튼 (첫 번째 블록이 아닐 때만 노출)
    if (startPage > 0) {
        const prevLi = document.createElement('li');
        prevLi.className = 'page-item';
        prevLi.innerHTML = `<a class="page-link" href="#" onclick="loadWords(${startPage - 1}); return false;">&laquo;</a>`;
        nav.appendChild(prevLi);
    }

    // 2. 숫자 번호 버튼 (startPage부터 endPage까지)
    for (let i = startPage; i < endPage; i++) {
        const li = document.createElement('li');
        li.className = `page-item ${i === currentPage ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#" onclick="loadWords(${i}); return false;">${i + 1}</a>`;
        nav.appendChild(li);
    }

    // 3. [다음] 화살표 버튼 (마지막 블록이 아닐 때만 노출)
    if (endPage < totalPages) {
        const nextLi = document.createElement('li');
        nextLi.className = 'page-item';
        nextLi.innerHTML = `<a class="page-link" href="#" onclick="loadWords(${endPage}); return false;">&raquo;</a>`;
        nav.appendChild(nextLi);
    }
}

    // 초기 실행
    loadWords(0);
</script>
